<title id="title">JevBench, one request at a time: every engine</title>
<desc id="desc">Mean ms per item over the 231 public JevBench items (lower is better). StartLux-Decision-v1-4B and -9B on an RTX 5090, -27B on an H200, from their Q8_0 files; every engine alone on the GPU, unique requests through the same HTTP client. decider and JevK5 run StartLux's weights as same-shape stand-ins (they ship no StartLux checkpoint).</desc>
