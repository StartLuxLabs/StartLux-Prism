<text x="22.0" y="397.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">Prompt length in thousands of tokens. On the RTX 5090 flash-jev runs with --prefix-cache 0 (its largest batch then 98,304 tokens)</text>
<text x="22.0" y="413.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">and SGLang with --mem-fraction-static 0.6 (it does not start otherwise); SGLang ran out of memory at 96k there, and between 128k</text>
<text x="22.0" y="429.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">and 192k on the H200. flash-jev refuses a request beyond its largest batch (HTTP 422); it never cuts one.</text>
