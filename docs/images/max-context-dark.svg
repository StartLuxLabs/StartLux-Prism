<text x="26.0" y="405.0" font-size="11.5" fill="#7d8899" text-anchor="start" font-weight="400">Prompt length in thousands of tokens. On the RTX 5090 StartLux-Prism runs with --prefix-cache 0 (its largest batch then 98,304 tokens) and</text>
<text x="26.0" y="421.0" font-size="11.5" fill="#7d8899" text-anchor="start" font-weight="400">SGLang with --mem-fraction-static 0.6 (it does not start otherwise); SGLang ran out of memory at 96k there, and between 128k and 192k on the</text>
<text x="26.0" y="437.0" font-size="11.5" fill="#7d8899" text-anchor="start" font-weight="400">H200. StartLux-Prism refuses a request beyond its largest batch (HTTP 422); it never cuts one.</text>
