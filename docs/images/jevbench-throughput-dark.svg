<title id="title">JevBench from 32 clients: every engine</title>
<desc id="desc">Requests per second while 32 clients send the 231 public items, three passes each (higher is better); no engine failed a request. StartLux-Decision-4B and -9B on an RTX 5090, -27B on an H200. decider and JevK5 run StartLux's weights as same-shape stand-ins (they ship no StartLux checkpoint).</desc>
