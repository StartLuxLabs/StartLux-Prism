<title id="title">Several GPUs: StartLux-Decision v1.1 27B on H200s</title>
<desc id="desc">StartLux-Prism int8, JevBench. Data parallelism (DP: whole servers behind the router) for throughput, tensor parallelism (TP: one model split over the GPUs) for the time per request. Every configuration answers as one GPU does, bit for bit; one GPU in gray, for scale.</desc>
