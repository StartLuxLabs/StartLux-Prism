<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="title">Several GPUs: StartLux-Decision v1.1 27B on H200s</title>
<desc id="desc">flash-jev int8, JevBench. Data parallelism (DP: whole servers behind the router) for throughput, tensor parallelism (TP: one model split over the GPUs) for the time per request. Every configuration answers as one GPU does, bit for bit; one GPU in gray, for scale.</desc>
